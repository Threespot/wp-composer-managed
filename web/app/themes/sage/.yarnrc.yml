approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.1.cjs

# Packages must be at least 7 days old
npmMinimalAgeGate: 10080

npmPreapprovedPackages:
  - "frontline-sass"
  - "frontline-css-reset"
  - "@threespot/expand-toggle"

# @roots/vite-plugin pulls in @wordpress/dependency-extraction-webpack-plugin, whose
# webpack peer is irrelevant under Vite. (Yarn packageExtensions can only add missing
# peers, not widen existing ranges - so the stale eslint ranges in eslint-plugin-import
# and eslint-plugin-react can't be fixed here.)
packageExtensions:
  "@wordpress/dependency-extraction-webpack-plugin@*":
    peerDependenciesMeta:
      webpack:
        optional: true
